<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKSOMA · 私人医疗秘书工作台</title><link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="admin.css?v=20260731-1"><script type="module" src="admin.mjs?v=20260801-2"></script></head>
<body>
    <section class="login-screen" id="loginScreen"><form class="login-card" id="loginForm"><p class="eyebrow">PRIVATE ADVISORY DESK</p><h1>ARKSOMA</h1><p class="login-cn">方舟计划 · 顾问工作台</p><label><span>用户名</span><input id="username" name="username" autocomplete="username" required></label><label><span>密码</span><input id="password" name="password" type="password" autocomplete="current-password" required></label><button id="loginButton" type="submit">进入工作台</button><p class="form-message" id="loginMessage" role="alert"></p></form></section>
    <div class="admin-shell" id="adminShell" hidden><aside class="sidebar"><div class="admin-brand"><strong>ARKSOMA</strong><span>PRIVATE ADVISORY DESK</span></div><nav><button class="active" data-view="customers" type="button"><span>01</span>客户管理</button><button data-view="knowledge" type="button"><span>02</span>销售答疑</button></nav><div class="system-state"><i></i><div><strong id="advisorName">PRIVATE DESK</strong><span>专属客户资料已隔离</span></div></div><button class="logout-button" id="logoutButton" type="button">安全退出</button></aside>
        <main class="admin-main"><header class="topbar"><div><p id="pageEyebrow">CUSTOMER CONTINUITY</p><h1 id="pageTitle">客户管理</h1></div><div class="top-actions"><span id="lastUpdated">等待刷新</span><button id="refreshCurrent" type="button">刷新</button></div></header>
            <section class="view-panel" id="customersView"><section class="order-workspace flat-workspace"><header class="workspace-head"><div><p>ASSIGNED CUSTOMERS</p><h2>我的客户</h2></div><span id="customerCount">—</span></header><div class="filters"><label class="search-field"><span>搜索</span><input id="customerSearch" type="search" placeholder="姓名或联系方式"></label></div><div class="table-shell"><table><thead><tr><th>客户</th><th>联系方式</th><th>最近期次</th><th>会员期限</th><th>服务状态</th></tr></thead><tbody id="customersBody"></tbody></table></div></section></section>
            <section class="view-panel" id="knowledgeView" hidden><section class="order-workspace flat-workspace"><header class="workspace-head"><div><p>SALES PLAYBOOK</p><h2>客户旅程答疑</h2></div></header><div class="filters"><label class="search-field"><span>搜索</span><input id="knowledgeSearch" type="search" placeholder="输入客户问题"></label></div><div class="knowledge-grid" id="knowledgeList"></div></section></section>
        </main>
    </div>
    <aside class="order-drawer" id="drawer" hidden><button class="drawer-backdrop" type="button" data-close-drawer aria-label="关闭"></button><div class="drawer-panel"><header class="drawer-head"><div><p>PRIVATE CUSTOMER</p><h2 id="drawerTitle">客户详情</h2></div><button type="button" data-close-drawer>关闭</button></header><div id="drawerContent"></div></div></aside><div class="toast" id="adminToast"></div>
</body></html>
